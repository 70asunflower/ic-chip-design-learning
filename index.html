<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IC Chip Design Learning · 学习路径</title>
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-hover: #f1f5f9;
  --ink: #0f172a;
  --muted: #475569;
  --faint: #94a3b8;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --accent: #2563eb;
  --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
}

html[data-theme="dark"] {
  --bg: #0f1115;
  --surface: #181b20;
  --surface-hover: #22262e;
  --ink: #f1f5f9;
  --muted: #94a3b8;
  --faint: #64748b;
  --border: #2a2f3a;
  --border-strong: #3f4756;
  --accent: #3b82f6;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, input { font-family: inherit; }

/* 顶部导航 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.topin {
  max-width: 1400px;
  margin: 0 auto;
  padding: 12px 28px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.2px;
  white-space: nowrap;
}
.brand span {
  color: var(--faint);
  font-size: 13px;
  font-weight: 400;
  margin-left: 8px;
}
.spacer { flex: 1; }
.tbtn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.tbtn:hover {
  color: var(--ink);
  border-color: var(--border-strong);
  background: var(--surface-hover);
}

/* 图标按钮 */
.ibtn{width:34px;height:34px;flex-shrink:0;display:inline-grid;place-items:center;padding:0;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:7px;
  cursor:pointer;transition:all .15s}
.ibtn:hover{color:var(--ink);border-color:var(--border-strong);background:var(--surface-hover)}
.ibtn svg{width:16px;height:16px;grid-area:1/1}
.ibtn{position:relative}
.ibtn::after{content:attr(data-tip);position:absolute;top:calc(100% + 9px);left:50%;
  transform:translateX(-50%) translateY(-4px);background:var(--ink);color:var(--surface);
  font-size:11px;line-height:1.4;white-space:nowrap;padding:5px 9px;border-radius:6px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:100}
.ibtn:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
html[data-theme="light"] .i-moon{display:none}
html[data-theme="dark"] .i-sun{display:none}

/* 头部说明 */
.intro {
  max-width: 1400px;
  margin: 0 auto;
  padding: 36px 28px 18px;
}
.intro h1 {
  font-size: clamp(24px, 3vw, 32px);
  font-weight: 700;
  line-height: 1.25;
  margin: 0;
  letter-spacing: -0.5px;
}
.intro p {
  color: var(--muted);
  max-width: 720px;
  margin: 8px 0 0;
  font-size: 13.5px;
}
.intro .meta {
  font-size: 12px;
  color: var(--faint);
  margin-top: 10px;
}
.intro .meta b {
  color: var(--ink);
  font-weight: 600;
}

/* 搜索与筛选栏 */
.controls {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 28px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.search {
  max-width: 460px;
  position: relative;
}
.search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
}
.search svg {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  color: var(--faint);
}

.legend {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.lg {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  padding: 5px 11px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.lg i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c);
}
.lg:hover {
  color: var(--ink);
  border-color: var(--border-strong);
}
.lg.on {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}

/* 树状图画布 */
.stage {
  max-width: 1400px;
  margin: 0 auto;
  padding: 8px 28px 80px;
  overflow-x: auto;
}
.tree {
  position: relative;
  min-width: 1220px;
  margin: 0 auto;
}
.wires {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
}
.wires path {
  transition: opacity 0.2s, stroke-width 0.2s;
}
.divider-line {
  position: absolute;
  left: 200px;
  right: 20px;
  border-top: 1px dashed var(--border-strong);
  pointer-events: none;
}
.divider-label {
  position: absolute;
  right: 24px;
  transform: translateY(-50%);
  background: var(--bg);
  padding: 0 8px;
  font-size: 11px;
  color: var(--faint);
}

.node {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  transition: opacity 0.2s, transform 0.15s, border-color 0.15s, background-color 0.15s;
}
.node.dim { opacity: 0.14; }

/* 根节点 */
.n-root {
  left: 8px;
  width: 152px;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--surface);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  box-shadow: var(--shadow);
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.n-root small {
  font-size: 11px;
  font-weight: 400;
  opacity: 0.65;
}

/* 主干节点 */
.n-trunk {
  left: 210px;
  width: 184px;
  padding: 7px 11px;
  border-radius: 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3.5px solid var(--c);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.n-trunk:hover, .n-trunk.active-path {
  border-color: var(--c);
  box-shadow: var(--shadow);
}
.n-trunk .badge-base {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--surface-hover);
  color: var(--muted);
}
.n-trunk .cnt {
  margin-left: auto;
  color: var(--faint);
  font-size: 11px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 400;
}
.n-trunk .fold {
  font-size: 11px;
  color: var(--faint);
  font-weight: 400;
  width: 12px;
  text-align: center;
}

/* 技能节点 */
.n-skill {
  left: 440px;
  width: 184px;
  padding: 6px 10px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
}
.n-skill:hover, .n-skill.active-path {
  color: var(--ink);
  border-color: var(--c);
  background: var(--surface-hover);
}
.n-skill .fold {
  margin-left: auto;
  font-size: 11px;
  color: var(--faint);
}
.n-skill.empty {
  cursor: default;
  opacity: 0.45;
  border-style: dashed;
  background: transparent;
}
.n-skill.empty:hover {
  color: var(--muted);
  border-color: var(--border);
  background: transparent;
}

/* 资源叶子节点 */
.n-leaf {
  left: 672px;
  width: 520px;
  padding: 3px 8px 3px 4px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12.5px;
}
.n-leaf:hover {
  background: var(--surface);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}
.n-leaf .pip {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 1.5px solid var(--c);
  display: grid;
  place-items: center;
  font-size: 9px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--c);
  background: var(--surface);
  transition: all 0.15s;
}
.n-leaf .txt {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink);
}
.n-leaf .kind {
  margin-left: auto;
  flex-shrink: 0;
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--surface-hover);
  color: var(--muted);
  border: 1px solid var(--border);
}
.n-leaf:hover .pip, .n-leaf.selected .pip {
  background: var(--c);
  color: #ffffff;
}
.n-leaf:hover .txt, .n-leaf.selected .txt {
  color: var(--c);
  font-weight: 600;
}
.n-leaf.hit .pip {
  background: var(--c);
  color: #ffffff;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c);
}
.n-leaf.faded { opacity: 0.18; }

/* 侧边详情抽屉 */
.drawer-mask {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(15, 23, 42, 0.25);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.drawer-mask.open {
  opacity: 1;
  pointer-events: auto;
}
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 90;
  width: min(480px, 94vw);
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transform: translateX(100%);
  transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.breadcrumb {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.breadcrumb i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.close-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  width: 28px;
  height: 28px;
  border-radius: 6px;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 16px;
}
.close-btn:hover {
  color: var(--ink);
  background: var(--surface-hover);
}
.drawer h2 {
  margin: 0;
  font-size: 18px;
  line-height: 1.4;
  font-weight: 700;
}
.drawer-desc {
  margin: 0;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.65;
  padding: 12px 14px;
  background: var(--bg);
  border-radius: 8px;
  border: 1px solid var(--border);
}
.drawer-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.drawer-tags span {
  font-size: 11.5px;
  padding: 3px 8px;
  border-radius: 5px;
  background: var(--surface-hover);
  color: var(--muted);
  border: 1px solid var(--border);
}
.drawer-meta {
  font-size: 12px;
  color: var(--faint);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
/* 抽屉正文：直接渲染资源 Markdown */
.drawer-body{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;background:var(--bg);font-size:13px;line-height:1.75}
.drawer-body h1,.drawer-body h2,.drawer-body h3{line-height:1.35;margin:1.2em 0 .5em;font-weight:650}
.drawer-body h1{font-size:19px;border-bottom:1px solid var(--border);padding-bottom:.3em}
.drawer-body h2{font-size:16px} .drawer-body h3{font-size:14px}
.drawer-body p{margin:.6em 0}
.drawer-body a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.drawer-body code{background:var(--surface-hover);padding:1px 5px;border-radius:4px;font-size:.9em;font-family:ui-monospace,Consolas,monospace}
.drawer-body pre{background:var(--surface-hover);padding:11px 13px;border-radius:7px;overflow-x:auto;line-height:1.5}
.drawer-body pre code{background:transparent;padding:0}
.drawer-body blockquote{margin:.7em 0;padding:.3em .9em;border-left:3px solid var(--border-strong);color:var(--muted)}
.drawer-body table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:12px}
.drawer-body th,.drawer-body td{border:1px solid var(--border);padding:5px 7px;text-align:left}
.drawer-body ul,.drawer-body ol{padding-left:1.4em;margin:.5em 0}
.drawer-body hr{border:0;border-top:1px solid var(--border);margin:1em 0}
.drawer-actions {
  padding-top: 4px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
}
.primary-btn {
  flex: 1;
  text-align: center;
  background: var(--ink);
  color: var(--surface);
  padding: 10px 16px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  transition: opacity 0.15s;
}
.primary-btn:hover { opacity: 0.88; }

footer {
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--faint);
  font-size: 12px;
  padding: 20px;
}

@media (max-width: 760px) {
  .intro, .controls, .stage, .topin { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>

  <h1>IC 芯片设计技术栈与学习路径</h1>

<script>/**

<script>
const TREE = {"root":"IC 芯片设计技术栈","foundation":{"name":"基础层","skills":[{"name":"C / Linux 系统编程","items":[{"title":"Linux C编程一站式学习","short":"Linux C编程一站式学习","desc":"C 语言 + Linux 系统编程一站式覆盖（宋劲杉）","date":"2026-04-26","tags":["linux","c","programming","systems","book"],"content":"\n## 核心要点（摘要）\n\n经典中文 C 语言教材，从 C 语言基础到 Linux 系统编程一站式覆盖。作者宋劲杉，原书名《Linux C编程一站式学习》。\n\n## 内容覆盖\n\n- **C 语言基础**：数据类型、控制流、函数、指针、数组、字符串\n- **C 进阶**：结构体、宏、链接与编译过程、Makefile\n- **Linux 系统编程**：文件 I/O、进程、信号、管道、环境变量\n- **底层数据表示**：整数的补码表示、浮点数、位运算\n\n## 个人备注\n\nYSYX 项目的 C 语言功底基石——PA 实验要求对指针、内存布局、链接过程有深入理解，这本书把 C 和 Linux 系统知识串起来了。重点看指针章节和编译链接过程部分。\n\n_Last updated: 2026-04-26_\n","path":"0-Resources/1-Books/linux-c-programming.md"}]},{"name":"计算机体系结构","items":[{"title":"Computer Architecture: A Quantitative Approach","short":"CA: 量化研究方法","desc":"Hennessy & Patterson 体系结构经典教材（含学习笔记链接）","date":"2026-03-31","tags":["book","computer-architecture","risc-v","cache","virtual-memory"],"content":"\n## 核心要点（摘要）\n\n计算机体系结构领域的经典教材（Hennessy & Patterson）。第 6 版把 ISA 换成 RISC-V，\n并新增领域专用体系结构（DSA）章节。全书的方法是「先量化再设计」——每个设计选择\n都要求给出性能 / 功耗 / 面积的依据，而不是凭直觉。\n\n## 详细内容\n\n- 主线：量化设计方法 → 存储层次 → 指令级并行 → 数据级并行 → 线程级并行 → DSA\n- 附录 B（Cache and Memory Hierarchy）是缓存部分的完整推导，常被单独当参考手册用\n- 第 6 版新增 RISC-V 与 DSA（含 TPU 类加速器）内容，与 5 版差异较大\n\n## 个人备注\n\n配套中文学习笔记见\n[CA: Quantitative Approach 学习笔记](../../1-Notes/1-Digital-Design/ca-quantitative-approach-notes.md)，\n目前覆盖附录 B 的 Cache 与 Memory Hierarchy，持续更新。\n\n_Last updated: 2026-04-22_\n","path":"0-Resources/1-Books/computer-architecture-quantitative-approach.md"},{"title":"计算机体系结构「森林导览」","short":"计算机体系结构「森林导览」","desc":"87页研一综述：从通用处理器到 LLM/Tansformer 加速、Chiplet、神经形态/量子/光子，附PDF","date":"2026-06-09","tags":["computer-architecture","paper","cpu","gpu","dsa","memory","chiplet"],"content":"\n> 一篇面向研一新生的计算机体系结构综述——\"地图式\"体例，从通用处理器到新兴范式\n\n## 基本信息\n\n| 项目 | 详情 |\n|------|------|\n| **页数** | 87 页 |\n| **定位** | 研一新生入学级综述 |\n| **体例** | 地图式：每章先讲分支解决的问题 + 核心张力，再点锚点文献 |\n| **证据分级** | 奠基★ / 必读★★ / 有争议† / 推测性⚠ |\n\n## 内容架构\n\n### 第一圈：通用处理器\n\n| 子主题 | 核心内容 |\n|--------|----------|\n| 指令集架构 (ISA) | CISC vs RISC, RISC-V 开放 ISA |\n| 微架构 | 超标量、乱序执行、Tomasulo、分支预测、超线程 |\n| 存储层次 | 多级 Cache、局部性原理、虚拟内存、TLB、大页 |\n| 多核与一致性 | MESI、内存一致性模型 (SC/TSO/弱序)、片上网终 (NoC) |\n| 数据并行 & GPU | CUDA、SIMT、Tensor Core |\n\n### 第二圈：领域专用架构 (DSA)\n\n| 子主题 | 核心内容 |\n|--------|----------|\n| AI/深度学习加速器 | 脉动阵列、数据流、稀疏加速 |\n| LLM/Transformer 加速 | KV Cache、FlashAttention、PagedAttention、推测性解码 |\n| 可重构计算 | FPGA、粗粒度重构 (CGRA) |\n| 其他领域加速 | 图计算、数据库、基因组 |\n\n### 第三圈：打破瓶颈\n\n| 子主题 | 核心内容 |\n|--------|----------|\n| 近存/存内计算 | 内存墙、PIM、HBM、CXL、OpenCAPI |\n| 新型存储与内存解耦 | 内存池化、CXL.mem |\n| 互连与集成 | Chiplet、先进封装、UCIe、D2D 互联 |\n| 网络与 I/O 卸载 | SmartNIC、DPU (BlueField)、RDMA |\n\n### 第四圈：物理与安全约束\n\n| 子主题 | 核心内容 |\n|--------|----------|\n| 微架构安全 | Spectre/Meltdown、RowHammer、侧信道、机密计算 (SGX/TDX/SEV/CCA) |\n| 可靠性 | 软错误、老化、变异、近似计算 |\n| 能效与数据中心 | Dark Silicon、PUE、Dennard Scaling 终结 |\n\n### 远景林：新兴范式\n\n| 子主题 | 核心内容 |\n|--------|----------|\n| 神经形态计算 | Loihi、TrueNorth、SNN、忆阻器 |\n| 量子计算 | Surface Code、纠错、超导 |\n| 光子/模拟计算 | 光子矩阵乘法、Lightmatter、Lightelligence |\n\n## 与现有资源关联\n\n- **Computer Architecture: A Quantitative Approach**（仓库 1-Books）— 体系结构经典教材，这篇森林导览可作为快速索引和知识地图配合使用\n\n## PDF 原文\n\n见本目录同名 PDF 文件。\n\n_Last updated: 2026-06-09_\n","path":"0-Resources/2-Papers/computer-architecture-forest-guide.md"},{"title":"RISC-V 规范库（Ratified Specifications Library）","short":"RISC-V 规范库","desc":"RISC-V International 官方规范库，ISA/配置集/平台/软件全部批准规范 HTML+PDF 一站式查阅","date":"2026-11-20","tags":["risc-v","isa","specification","platform","reference"],"content":"\n> RISC-V International 官方维护的**唯一权威规范汇总站**：收录全部已批准（Ratified）的 RISC-V 规范，按主题分组，每份提供 HTML 在线阅读与 PDF 下载。查规范不必再翻各个 GitHub 仓库和邮件列表。\n\n## 核心要点（摘要）\n\n- **发布方**：RISC-V International，站点声明只收录 ratified（已批准、稳定）规范\n- **形式**：每条规范都有 HTML + PDF 两种格式，另有 \"More\" 链到原始文档 / Jira\n- **分类**：Core Architecture / Profiles / Platforms / System Architecture / Debug, Trace, RAS / Platform Software / Application Enablement 七大类\n- **状态语义**：标为 Ratified 的文档不可再修改，后续演进通过新扩展或新版本发布\n- **价值**：做 RISC-V 处理器、系统软件或服务器平台时，这里是判定\"合不合规范\"的最终依据\n\n## 详细内容\n\n### 核心架构（Core Architecture）\n\n| 规范 | 版本 | 时间 |\n|------|------|------|\n| Unprivileged ISA（非特权指令集） | v20260120 | 2026-01 |\n| Privileged ISA（特权架构 / M、S 模式） | v20260120 | 2026-01 |\n\n### 配置集（Profiles）\n\n| 规范 | 版本 | 时间 |\n|------|------|------|\n| RISC-V Profiles（框架） | v1.0 | 2023-04 |\n| RVA23（应用处理器） | v1.0 | 2024-10 |\n| RVB23（嵌入式与边缘） | v1.0 | 2024-10 |\n\n### 平台（Platforms）\n\n- **Server Platform v1.0**（2026-05）：服务器平台硬件 / 固件 / 安全能力的最小契约\n- **Server SoC v1.0**（2025-02）：服务器级 SoC 要求与约定\n\n### 系统架构（System Architecture）\n\n- Advanced Interrupt Architecture（AIA）v1.0（2023-06）\n- IOMMU v20260222（2026-02）\n- Platform-Level Interrupt Controller（PLIC）v1.0.0（2023-02）\n- Server SoC v1.0（2025-02）\n\n### 调试、追踪与 RAS（Debug, Trace, RAS）\n\n- Debug Specification v1.0（2025-02）、Efficient Trace v2.1（2026-10）、RERI v1.0（2024-05）\n- Trace 系列：N-Trace、Trace Connectors、Trace Control Interface（均 2024-11）、HART Trace Interface v1.0（2026-09）、Unformatted Trace & Data Encapsulation v1.0（2024-06）\n- QoS Register Interface v1.0（2024-06）\n\n### 平台软件（Platform Software）\n\n- Supervisor Binary Interface（SBI）v3.0（2025-07）\n- Boot and Runtime Services（BRS）v1.0（2025-08）\n- UEFI Protocol v1.0.0（2022-05）、Platform Management Interface v1.0（2025-07）\n- Semihosting v1.0（2025-02）、IO Mapping Table v1.0（2025-03）、Functional Fixed Hardware v1.0.1（2024-10）、QoS Controllers Table v1.0（2026-06）\n\n### 应用使能（Application Enablement）\n\n- Application Binary Interface v1.0（2022-11）\n- Vector C Intrinsic v1.0（2025-04）\n\n## 个人备注\n\n这份规范库是 RVA23、Server Platform 等专题的**源头**——想确认某个扩展是不是强制、某个 CSR 定义，直接回这里查 PDF，不要依赖二手博客。搭配仓库里的 [xv6-riscv](../5-Courses-Tutorials/xv6-riscv.md) 使用效果最好：读源码时对照特权 ISA 规范里的 `stvec`/`sepc`/`satp` 等 CSR，能把\"软件行为 ↔ 硬件接口\"这条链路真正打通。\n\n_Last updated: 2026-11-20_\n","path":"0-Resources/6-Industry-Standards/riscv-specifications-library.md"}]},{"name":"集成电路通识","items":[{"title":"Bits on Chips（芯片上的比特，第3版）","short":"Bits on Chips","desc":"Veendrick 著，Springer 集成电路通识导论，覆盖设计/制造/应用全链条（含 2nm 节点）","date":"2026-07-02","tags":["semiconductor","cmos","book","pdf"],"content":"\n> Harry Veendrick · Springer · 2026-07-02（第 3 版）· 英文原版\n\n## 内容简介\n\n集成电路（微电子）通识类导论读物，由前 NXP 资深工程师 Harry Veendrick 撰写。完整讲解芯片从设计、工艺制造到系统应用的全链条知识，覆盖先进制程、2nm 节点与芯片产业生态。公式推导极少，侧重概念与行业全景，兼顾零基础科普与工程宏观概述。\n\n## 内容覆盖\n\n- **全链条视角**：芯片设计 → 工艺制造 → 封装测试 → 系统应用\n- **先进制程**：覆盖至 2nm 节点，并包含 More than Moore（微/纳机电系统、微化学系统、传感器与执行器）\n- **产业生态**：芯片产业链、设计 / 制造 / EDA 分工全景\n- **双受众结构**：第一部分面向几乎无技术背景的读者（用「芯片平面图 ≈ 城市规划图」等类比讲解）；第二部分面向半导体从业者拓展视野\n\n## 适用人群\n\n- 微电子、集成电路入门本科生\n- 跨行业转入半导体行业的从业者\n- 芯片产业方向的科普学习者\n\n## 前置基础\n\n无需深厚电路基础。\n\n## 出版信息\n\n- 作者：Harry Veendrick（前 NXP / Philips Research 资深工程师）\n- 出版社：Springer（Cham）\n- 版本：第 3 版（Third Edition）\n- 出版日期：2026-07-02\n- 篇幅：XV + 317 页，25 幅黑白插图、183 幅彩色插图\n- 官方站点：http://www.bitsonchips.com/\n- DOI：https://doi.org/10.1007/978-3-032-19350-6\n\n_Last updated: 2026-07-02_\n","path":"0-Resources/1-Books/bits-on-chips-veendrick.md"},{"title":"Branch Education IC 系列","short":"Branch Education IC 系列","desc":"3D 动画科普：光刻→芯片制造→CPU 架构","date":"2026-06-29","tags":["branch-education","video","semiconductor","lithography","computer-architecture"],"content":"\n> Branch Education 出品的三部 IC 相关 3D 动画科普视频，覆盖芯片制造（光刻→晶圆→封装）与 CPU 微架构（Fetch-Decode-Execute 循环）。\n\n## 目录\n\n| # | 视频 | 时长 | 主题 |\n|---|------|------|------|\n| 1 | [How does EUV Lithography Work?](https://youtu.be/B2482h_TNwg) | — | ASML EUV 光刻机工作原理——世界上最精密的机器 |\n| 2 | [How are Microchips Made? CPU Manufacturing Process Steps](https://youtu.be/dX9CGRZwD-w) | — | 从硅片到处理器：芯片制造全流程步骤 |\n| 3 | [How do CPUs Work? The Engineering that Runs the Digital World](https://youtu.be/16zrEPOsIcI) | 36:23 | CPU 内部结构 3D 导览：指令周期（取指→译码→执行） |\n\n## 视频详情\n\n### 1. How does EUV Lithography Work?\n- **频道**: Branch Education\n- **类型**: 芯片制造/光刻技术\n- **内容**: 深入讲解 EUV（极紫外）光刻机的工作原理，追踪 EUV 从早期概念验证到 ASML 最先进机器的技术演进史\n\n### 2. How are Microchips Made? CPU Manufacturing Process Steps\n- **频道**: Branch Education\n- **类型**: 芯片制造/半导体工艺\n- **内容**: 完整展示芯片制造全过程——从硅锭切割、光刻、掺杂、沉积到封装测试，全面覆盖 CPU 制造的核心工艺步骤\n\n### 3. How do CPUs Work? The Engineering that Runs the Digital World\n- **频道**: Branch Education\n- **时长**: 36:23\n- **类型**: 计算机体系结构/CPU 微架构\n- **内容**: 3D 动画导览 CPU 内部结构：\n  - Fetch-Decode-Execute 指令周期详解\n  - 程序计数器（PC）/ 循环与分支\n  - RISC vs CISC\n  - ASIC 与 FPGA 对比\n  - CPU vs SoC vs GPU 架构差异\n\n## 学习建议\n\n建议按以下顺序观看：\n1. **光刻机工作原理** → 了解最上游的制造设备\n2. **芯片制造全流程** → 从硅片到芯片的完整工艺\n3. **CPU 工作原理** → 理解最终产物的内部架构\n\n三部视频均由 Branch Education 制作，具备业界顶尖的 3D 动画质量，适合作为 IC 设计入门前置科普。\n\n_Last updated: 2026-06-29_\n","path":"0-Resources/5-Courses-Tutorials/branch-education-ic-series.md"},{"title":"全网最详细的芯片制造全过程（抖音）","short":"芯片制造全过程（视频）","desc":"大黄视界频道：从硅片到成品芯片的完整制造流程","date":"2026-06-25","tags":["semiconductor","video"],"content":"\n**来源**: 抖音 - 大黄视界频道  \n**日期**: 2026-06-25  \n**链接**: https://v.douyin.com/PdPM3UJ_Agc/\n\n> 看完绝对涨知识！全网最详细的芯片制造全过程讲解。\n\n## 备注\n\n- 来自抖音短视频，详细介绍了从硅片到成品芯片的完整制造流程\n- 适合作为芯片设计入门的基础科普资料\n\n_Last updated: 2026-08-01_\n","path":"0-Resources/7-Videos/chip-manufacturing-process-douyin.md"}]},{"name":"半导体物理与器件","items":[]}]},"branches":[{"name":"数字设计","skills":[{"name":"RTL / HDL","items":[{"title":"NEORV32","short":"NEORV32","desc":"纯 VHDL RISC-V SoC，支持 6 大 FPGA 厂商 + ASIC 流片","date":"2026-05-29","tags":["risc-v","vhdl","soc","fpga","open-source"],"content":"\n## 核心要点（摘要）\n\nNEORV32 是一个完全用 VHDL 编写的可定制 RISC-V 微控制器 SoC，目标是成为 FPGA 上的辅助控制器或独立微控制器。零外部依赖、平台无关、开箱即用，适合 RISC-V 入门和实际项目开发。\n\n## 详细内容\n\n### 处理器核心\n\n- 基础 ISA：RV32I / RV32E，可选扩展：M、A、C、B、U、X\n- 支持大量标准扩展：位操作（Zba/Zbb/Zbc/Zbs）、加密（Zkn/Zks 系列）、浮点（Zfinx，使用整数寄存器）\n- 支持 SMP 双核配置\n- 自定义指令单元（CFU）\n- RISC-V Architecture ID 19，通过官方 RISC-V ACT 认证测试\n\n### SoC 外设\n\n- JTAG 片上调试器（兼容 OpenOCD、GDB、Segger）\n- 预装 bootloader，支持 UART/I²C/SPI Flash/SD 卡启动\n- DMA、真随机数发生器、Trace 端口（RVFI 兼容）\n- 丰富的可配置外设\n\n### FPGA 支持\n\n- 已验证 6 大 FPGA 厂商：AMD(Xilinx)、Intel(Altera)、Lattice、Microchip、Gowin、Cologne Chip\n- 也有多次 ASIC 流片记录\n- 示例：Cyclone IV E 上 ~130 MHz，约 2300 LUTs + 1000 FFs\n\n### 软件生态\n\n- RISC-V GCC 工具链 + Eclipse IDE\n- Zephyr RTOS、FreeRTOS 官方支持\n- MicroPython、Ada(HAL)、Rust(Embassy) 移植\n- LiteX SoC 构建器集成\n- 可运行 nommu-Linux\n\n### 项目数据\n\n- GitHub Stars: 2100+\n- Commits: 10291\n- License: BSD-3-Clause\n- CoreMark: 95.23 (0.9523 CoreMarks/MHz, rv32imc 配置)\n\n## 个人备注\n\nNEORV32 是学习 RISC-V 处理器设计的优秀开源参考项目。纯 VHDL 实现、文档完善、社区活跃，适合从 RTL 入门到实际 FPGA 部署。后续可以结合学习笔记深入分析其流水线设计和外设架构。\n\n_Last updated: 2026-05-29_\n","path":"0-Resources/4-OpenSource-Projects/neorv32.md"},{"title":"XUANTIE-RV 玄铁","short":"XUANTIE-RV 玄铁","desc":"达摩院 RISC-V 开源生态，OpenC910/C906/E906 + wujian100 SoC","date":"2026-05-29","tags":["risc-v","processor","verilog","soc","alibaba","open-source"],"content":"\n> 阿里达摩院玄铁团队，RISC-V 处理器 IP 开源项目集群，69 个仓库\n\n## 基本信息\n\n| 项目 | 详情 |\n|------|------|\n| **组织** | XUANTIE-RV（达摩院玄铁） |\n| **隶属** | Alibaba DAMO Academy |\n| **仓库数** | 69 |\n| **许可证** | Apache-2.0 为主 |\n| **社区** | 玄铁生态 |\n\n## 核心项目\n\n### 🔧 RISC-V 处理器核 (OpenXuantie 系列)\n\n| 项目 | 说明 | Star | 语言 |\n|------|------|------|------|\n| [OpenC910](https://github.com/XUANTIE-RV/openc910) | 高性能 RISC-V 核（玄铁 C910 开源版） | 1.4k | Verilog |\n| [OpenC906](https://github.com/XUANTIE-RV/openc906) | 中端 RISC-V 核（玄铁 C906 开源版） | 401 | Verilog |\n| [OpenE902](https://github.com/XUANTIE-RV/opene902) | 嵌入式 RISC-V 核（玄铁 E902 开源版） | 178 | Verilog |\n\n### 🖥️ SoC 平台\n\n| 项目 | 说明 | Star | 语言 |\n|------|------|------|------|\n| [wujian100_open](https://github.com/XUANTIE-RV/wujian100_open) | 开源 SoC 平台，让 IC 设计\"更快更简单\" | 2k | Verilog |\n\n### 📐 规范与扩展\n\n| 项目 | 说明 | Star |\n|------|------|------|\n| [riscv-matrix-extension-spec](https://github.com/XUANTIE-RV/riscv-matrix-extension-spec) | RISC-V 矩阵扩展规范（面向 AI 应用） | 183 |\n\n### 📱 操作系统支持\n\n| 项目 | 说明 | Star |\n|------|------|------|\n| [riscv-aosp](https://github.com/XUANTIE-RV/riscv-aosp) | Android (AOSP) 玄铁 RISC-V 补丁 | 480 |\n| [xuantie-yocto](https://github.com/XUANTIE-RV/xuantie-yocto) | Yocto Linux for 玄铁 RISC-V | 42 |\n| [opensbi](https://github.com/XUANTIE-RV/opensbi) | RISC-V Supervisor Binary Interface | 19 |\n| [zero_stage_boot](https://github.com/XUANTIE-RV/zero_stage_boot) | 启动加载器 | 20 |\n\n### ✅ 测试与基准\n\n| 项目 | 说明 | Star |\n|------|------|------|\n| [damo-rv-ats](https://github.com/XUANTIE-RV/damo-rv-ats) | DAMO RISC-V 架构测试套件 | 9 |\n| [xtai-benchmark](https://github.com/XUANTIE-RV/xtai-benchmark) | AI 基准测试 | 1 |\n\n## 为什么值得关注\n\n- **国内最活跃的 RISC-V IP 开源生态**：C910/C906/E902 三档覆盖高性能→嵌入式\n- **wujian100 SoC 平台**：2k star，降低 IC 设计入门门槛\n- **矩阵扩展规范**：RISC-V + AI 的架构创新方向，与 AI 推理芯片设计直接相关\n- **完整工具链**：从处理器核→SoC→OS→测试，全栈开源\n\n_Last updated: 2026-05-29_\n","path":"0-Resources/4-OpenSource-Projects/xuantie-rv.md"}]},{"name":"RISC-V 实现","items":[{"title":"一生一芯（One Student One Chip）","short":"一生一芯","desc":"中科院计算所 RISC-V 处理器芯片全流程设计培养计划，免费流片","date":"2026-07-28","tags":["risc-v","processor","computer-architecture","rtl","verilog","chisel","tapeout","open-source-eda","education"],"content":"\n> 由中国科学院大学 / 中国科学院计算技术研究所于 2019 年发起的 chip 设计人才培养计划。指导学生**从零设计一款 RISC-V 处理器芯片**，在其上运行自己开发的系统软件与演示程序，并通过开源 EDA 工具与开源 PDK 完成物理设计流程、最终流片。\n\n## 核心定位\n\n- **全链条设计能力**：覆盖计算机系统全栈抽象层——从应用程序、运行时环境、简易操作系统、指令集，到处理器微结构设计、RTL 开发、逻辑综合、布局布线、时序分析，最终生成晶体管级可流片 GDSII 版图。\n- **开放 + 公益**：面向全球芯片设计爱好者，不限学校、专业、年级，全年开放报名（报名与学习均免费），随到随学，可零基础起步。\n- **免费流片机会**：达成指定学习目标（完成 B 阶段）的在校生，可获得免费或低成本流片指标，带着自己设计的芯片毕业。\n- **规模**：累计报名已逾 12000 人，覆盖全球 900 余所高校及科研院所。\n\n## 学习路径概览（以 2205 期为例）\n\n| 阶段 | 关键产出 |\n|------|----------|\n| 预学习阶段 | Linux 环境、Verilator 仿真、数字电路基础、C 语言复习（PA1） |\n| 基础阶段 | 简易调试器、支持 RV64IM 的 NEMU 指令集模拟器、单周期处理器 |\n| 进阶阶段 | 异常/中断、系统调用、总线与外设、SoC 计算机系统、Cache、流水线 |\n| 达成流片指标 | 接入 SoC，获得流片机会 |\n| 专家阶段 | 多道程序、分页虚拟内存、xv6 / Linux 运行、双发射、乱序执行、分支预测等 |\n\n学习始于 C 语言与数字电路基础，逐步引导实现可运行「超级玛丽」的 RISC-V 指令集模拟器 NEMU，并在其辅助下完成自己的处理器设计，最终在自己设计的 CPU 上运行 RT-Thread 乃至 Linux。新版讲义引入更细的阶段划分（FEDCBA），学习坡度更友好。\n\n## 关键资源\n\n- **课程官网 / 讲义**：https://ysyx.oscc.cc（项目概述、学习规划、实验指导）\n- **B 站视频号「一生一芯」**：https://space.bilibili.com/2107852263\n- **社区学习路线整理**（含 YSYX 说明）：https://github.com/PKUFlyingPig/cs-self-learning/blob/master/docs/体系结构/YSYX.md\n\n## 为什么放进 IC 学习库\n\n「一生一芯」是把前面分散的知识点（RISC-V 指令集、RTL、综合、时序、流片）串成一条**端到端实践主线**的最佳项目化入口，特别适合想从「读懂芯片」走向「造出芯片」的学习者。\n\n_Last updated: 2026-07-28_\n","path":"0-Resources/5-Courses-Tutorials/ysyx-one-student-one-chip.md"},{"title":"xv6-riscv（MIT 教学操作系统）","short":"xv6-riscv","desc":"MIT PDOS 出品的 RISC-V 教学操作系统，Unix v6 的 ANSI C 重实现，配套 6.1810 课程，10.8k 星","date":"2026-11-19","tags":["risc-v","operating-system","teaching","c","open-source","mit"],"content":"\n> Dennis Ritchie 与 Ken Thompson 的 Unix Version 6 的现代重实现，用 ANSI C 编写，目标平台是多核 RISC-V。它是 MIT 操作系统课程 6.1810 的教学用系统，**主要目的是简化与讲清概念，而非堆砌新特性**。\n\n## 核心要点（摘要）\n\n- **定位**：教学操作系统（teaching OS），不是生产级内核；代码简洁可读，专为配合课程与教材设计\n- **血缘**：复刻 Unix v6 的结构与风格，灵感来自 John Lions 的《Commentary on UNIX 6th Edition》\n- **语言 / 平台**：ANSI C 实现，面向 modern RISC-V multiprocessor（RV64）\n- **维护方**：MIT PDOS（Parallel and Distributed Operating Systems group）\n- **人气**：约 10.8k stars / 4.6k forks / 1700+ commits（截至收录时）\n- **许可**：BSD 系列开源许可（见仓库 LICENSE）\n\n## 详细内容\n\n### 操作系统子系统（源码逐章可对照）\n\n- 进程与内存管理：页表、trap 与系统调用、缺页\n- 中断与设备驱动、锁、调度、sleep/wakeup\n- 文件系统与日志（logging）\n- 多处理器支持（MP）：早期版本由 Cliff Frey、Xiao Yu 贡献\n\n### 构建与运行\n\n需要 RISC-V newlib 工具链（`riscv-gnu-toolchain`）与编译了 `riscv64-softmmu` 的 QEMU，加入 PATH 后执行 `make qemu` 即可启动；仓库提供 `test-xv6.py` 做回归测试。\n\n主要贡献者包括 Russ Cox（上下文切换、锁）、Nickolai Zeldovich、Austin Clements 等；错误与建议由 Frans Kaashoek 和 Robert Morris 接收。\n\n### 配套资源\n\n- 课程主页：https://pdos.csail.mit.edu/6.1810/ （含实验作业与在线资料）\n- 配套教材：[xv6-riscv Book](xv6-riscv-book.md) — 逐章讲解这份源码\n\n## 个人备注\n\nxv6 是理解「CPU 之上第一层软件如何运转」的最佳最小样本：进程、页表、中断、锁、文件系统都有清晰可读的实现。对于做 RISC-V 处理器的人，它能和「一生一芯」形成闭环——自己设计的核跑通 xv6，才算真正把指令集、特权级、CSR、中断控制器这些纸面概念串起来。建议与教材对照阅读，边读源码边打断点。\n\n_Last updated: 2026-11-19_\n","path":"0-Resources/5-Courses-Tutorials/xv6-riscv.md"},{"title":"xv6-riscv Book（教学操作系统教材）","short":"xv6-riscv Book","desc":"Russ Cox 等著的操作系统教材，逐章拆解 xv6-riscv 源码，MIT 6.828/6.1810 指定用书，在线免费读","date":"2026-11-19","tags":["risc-v","operating-system","book","education","mit"],"content":"\n> 书全名《xv6: a simple, Unix-like teaching operating system》，作者 Russ Cox、Frans Kaashoek、Robert Morris。原文自述为「a draft text intended for a class on operating systems」，明确要求**与 xv6 源码配合阅读**。\n\n## 核心要点（摘要）\n\n- **作者**：Russ Cox、Frans Kaashoek、Robert Morris\n- **定位**：操作系统入门教材，用研究示例内核 xv6 讲清 OS 主要概念\n- **配套**：与 [xv6-riscv 源码](xv6-riscv.md) 一一对应，书中带源码超链接\n- **使用课程**：MIT 6.828、6.1810（操作系统工程）\n- **获取方式**：网页在线免费阅读（本站即在线版），页面顶部附 Source Code 链接\n- **许可**：与 xv6 一脉相承的开放教学材料\n\n## 详细内容\n\n### 章节结构（13 章）\n\n| 章节 | 主题 |\n|------|------|\n| Foreword | 前言与致谢 |\n| 1 | Operating system interfaces |\n| 2 | Operating system organization |\n| 3 | Page tables |\n| 4 | Traps and system calls |\n| 5 | Page faults |\n| 6 | Interrupts and device drivers |\n| 7 | Locking |\n| 8 | Scheduling |\n| 9 | Sleep and wakeup |\n| 10 | File system |\n| 11 | Logging |\n| 12 | Concurrency revisited |\n| 13 | Summary |\n\n### 阅读方法\n\n每一章对应 xv6-riscv 内核的一份实现——先读概念，再跳进 `kernel/` 下对应文件对照。页面与课程主页 `pdos.csail.mit.edu/6.1810` 提供配套实验（lab），边读边做效果最好。\n\n### 与 IC 学习的关系\n\nxv6 运行在 RISC-V 上，书里讲的页表、trap、CSR、中断委托、S 模式等，正是处理器设计必须落地的硬件接口。它是「从 RTL 到能跑系统」这条链路上，衔接软件侧需求的关键参照。\n\n## 个人备注\n\n和源码条目配套收录。全书篇幅不大但信息密度高，适合系统性入门 OS，也适合作为 RISC-V 特权架构的实战注解。建议顺序：先读第 1–2 章建立整体框架，再按 3→4→5→6 打通内存与中断主线。\n\n_Last updated: 2026-11-19_\n","path":"0-Resources/5-Courses-Tutorials/xv6-riscv-book.md"}]},{"name":"向量扩展 RVV","items":[{"title":"RISC-V Vector Primer (RVV 1.0 指南)","short":"RVV 1.0 指南","desc":"面向架构师/编译器/边缘 AI 开发者的 RVV 实践指南，延伸 Matrix Extension","date":"2026-08-23","tags":["risc-v","vector","computer-architecture","compiler","kernel","ai"],"content":"\n> 一本面向**硬件架构师、编译器工程师与嵌入式/边缘 AI 开发者**的 RVV 实践指南。核心主张：把 RISC-V Vector Extension 从「一堆术语」翻译成「可被工程师操作的心智模型」，并延伸到新兴的 Matrix Extension。\n\n- **仓库**：https://github.com/simplex-micro/riscv-vector-primer\n- **性质**：开放技术书（非软件项目），内容集中在 Markdown 章节与配图，无构建系统/测试脚本/源码目录。README 建议直接浏览章节文件，从第一章开始读。\n\n## 项目核心思想\n\n**RVV 的核心野心：让软件摆脱固定硬件宽度，让同一套二进制能够在 128 / 256 / 512 甚至更宽的实现上自然伸缩。**\n\n传统 SIMD（MMX/SSE/AVX/AVX-512）把硬件宽度写进软件假设：每次扩展带来新寄存器宽度、新编码、新指令组合，硬件升级后软件要吃满新宽度往往要重新编译或运行时选择代码路径。\n\nRVV 更锋利：\n- ISA 描述「对一组元素执行操作」，硬件实际一次容纳多少元素由实现决定；\n- 软件通过 `vsetvl` 系列指令**动态询问并设置**当前可处理元素数。\n\n> 一句话心智模型：SIMD 是固定宽度的尺子，一次量多少由尺子长度决定；**RVV 是一套测量协议，硬件告诉软件本轮能处理多长，软件按这个长度推进循环**。\n\n## 章节结构\n\n| 章节 | 内容 |\n|------|------|\n| chapter-01 | RVV 概念、SIMD 对比、strip mining、chaining |\n| chapter-02 | RVV 核实现、512-bit VRF、lane、port pressure |\n| chapter-03 | SEW、LMUL、VL、vtype、掩码、vstart |\n| chapter-04 | load/store、compute、mask、permutation 指令族 |\n| chapter-05 | GEMM、MAC pipeline、性能分析、确定性执行 |\n| chapter-06 | 从一维向量到二维矩阵 tile 与 Matrix Extension |\n\n## 关键概念（VL / SEW / LMUL）\n\n- **SEW**：单个元素宽度（8/16/32/64 bit）\n- **VLEN**：单个向量寄存器的硬件宽度（芯片实现固定）\n- **LMUL**：把多个向量寄存器逻辑拼成一组，牺牲寄存器数量换取更长向量\n- **VL**：当前指令真正参与计算的元素数\n- **VLMAX**：当前 SEW 与 LMUL 下，一组向量寄存器最多容纳多少元素\n\n核心机制 `vsetvli`：同时设置 VL 与 vtype。编译器把剩余元素数放进 `a0`，硬件给出这次最合适的 VL——循环不硬编码「512 位能放 16 个 int32」，也不用知道目标机器实际 VLEN。这也让「尾巴处理」变得自然：VL 让最后一轮自动变短，循环结构仍然统一。\n\n## 硬件视角：512-bit VPU 的真实代价\n\n典型 RVV 核 = 标量 CPU + 向量处理单元 VPU。CPU 负责取指/提交/CSR 状态等控制逻辑；VPU 拥有向量寄存器文件（VRF）、向量整数/浮点/掩码/置换/load-store 单元。\n\n- **lane 切分**：512-bit VLEN / 4 lanes，每个 lane 处理 128-bit 切片，寄存器文件按 lane 切分，局部连线变短、时钟频率更易收敛。\n- **chaining**：前一条指令第一批结果刚出来，后一条依赖指令就能立刻消费，无需等整个向量写回 VRF——显著隐藏长向量延迟。\n\n> 项目核心判断：高性能 RVV 实现需要**调度、端口规划、旁路路径和异常语义共同配合**，向量性能来自流水线、寄存器文件、内存带宽与编译器循环形态的合奏。\n\n## 指令与编译器：内存形态决定性能\n\n指令分四类：memory / compute / mask / permutation。内存模式是关键成本模型：\n- **unit-stride**：连续访问，最易跑满带宽\n- **strided**：固定步长，适合列访问\n- **indexed**：任意偏移，表达力强但硬件冲突多\n- **segment**：AoS → SoA，适合 RGB/复数/结构数组\n\n置换指令把「不规则性从内存搬进寄存器」：`vrgather`/`vslideup`/`vslidedown`/`vcompress` 让程序先用连续 load 高效取数，再在 VRF 内重排。\n\n## 从向量到矩阵（下一层抽象）\n\n矩阵天然二维，RVV 向量寄存器是一维抽象。第六章提出的路线：\n- **RVV 承担**：控制流、数据搬运、layout transform、不规则与混合负载\n- **Matrix Extension 承担**：tile register file、二维 PE array、tile-level 矩阵乘加、降低指令开销、提高数据复用\n\n符合现代处理器趋势：标量管控制，向量管通用数据并行，矩阵单元管高度规则密集计算。\n\n## 为什么放进 IC 学习库\n\nRVV 是当前 CPU/AI 芯片设计的关键指令集扩展，直接衔接你的研究方向（AI 推理系统、加速器架构、数字 IC）。这本 Primer 相比正式 ISA 规格书更「可操作」，能把 VLEN/LMUL/vtype/vsetvl 等术语落到「编译器如何生成循环、处理器如何组织寄存器文件、AI 与矩阵计算如何获得吞吐」三层真实问题上。\n\n## 配套中文解读\n\nRISC-V 中文社区（公众号「RVV Primer」）于 2026-08-21 发布过一篇对本书的解读，从「规格书翻译器」视角逐章梳理，含推荐阅读路径与关键代码片段：\n- 微信公众号文章：https://mp.weixin.qq.com/s?__biz=MjM5NDczOTA4NQ==&mid=2447904731&idx=1&sn=5f64137c90261c786a381ccccde5f61a\n\n_Last updated: 2026-08-23_","path":"0-Resources/5-Courses-Tutorials/riscv-vector-primer.md"}]}]},{"name":"AI 芯片","skills":[{"name":"AI 加速器","items":[{"title":"nano-kpu","short":"nano-kpu","desc":"MoonshotAI：Kimi-K3 全流程设计的推理芯片 RTL（KDA 线性注意力 + MLA + MoE，int4），带完整仿真与综合流程","date":"2026-09-16","tags":["rtl","verilog","inference-chip","accelerator","moe","mla","linear-attention","quantization","open-source-eda","ai-designed","open-source"],"content":"\n> nano 级**混合架构推理芯片**的完整 RTL 设计 + 功能仿真 + 时序/面积评估流程，**由 Kimi-K3 全程设计实现**（仓库自述为 Kimi K3 的演示，非 Moonshot AI 官方项目）。Apache 2.0。目标模型是混合注意力 MoE transformer：**KDA（Kimi Delta Attention）线性注意力 + NoPE MLA + sigmoid-routed MoE（top-2 路由专家 + 1 共享专家）+ attention-residual mixing**，权重 int4 group-128，teacher-forced 逐 token 解码。\n\n## 仓库结构\n\n| 目录 | 内容 |\n|------|------|\n| `rtl/` | 芯片 RTL，顶层模块 `msh_chip_top`，`filelist.f` 为编译清单；`roms/` 放 LUT 初始化 hex（sigmoid/alpha/expneg/rsqrt/recip）；`selfmodel/` 是 bit-exact 定点 Python 模型（仿真辅助） |\n| `reference/` | float32 黄金参考模型（正确性判据，golden 在评估时重算） |\n| `harness/` | 功能仿真 + 性能评估流程：`evaluate.py` 主入口、Verilator C++ testbench（16 B/cycle DRAM 端口模型）、`msh_sram`/`msh_rom` 宏模型、`synth_area.ys`/`synth_tech.ys`/`synth_netlist.ys`（yosys 面积/NE、Nangate45 映射时序、门级网表） |\n| `docs/` | 架构 / 接口 / memory_map / 量化 / TASK_SPEC 规格文档 |\n| `weights/` | 权重格式说明 |\n\n## 接口与判据（工程细节值得学）\n\n- **接口**：命令流（`RUN 0x1` → `DONE 0xD0DE`）+ **128-bit DRAM 端口**（顺序读、≥24 cycle 延迟、posted write）+ 自描述内存镜像（header + descriptor table）\n- **正确性判据**：逐行 logits **cosine ≥ 0.98**、pooled **argmax ≥ 0.99**（对 float32 参考）\n- **吞吐**：`cycles_per_token = 长稳仿真周期 / seq_len`，`tokens/s = clock / cpt`\n- **存储规则**：所有超过触发器的阵列必须走 `msh_sram`/`msh_rom` 宏；宏位按 **~1 Mbit/mm²** 计价并计入面积预算\n\n## 工具链与运行\n\n```bash\nbash scripts/setup_env.sh        # 一次性：conda 环境 + Nangate45 cell library\nsource scripts/kpu-env.sh\npython3 harness/evaluate.py --quick   # 功能仿真（分钟级）\npython3 harness/evaluate.py           # 完整评估（仿真 + 时序/面积，小时级）\nmake synth / lint / audit / selftest\n```\n\n依赖 Verilator 5.x（基线 5.050）、yosys ≥ 0.64、python 3.12 + numpy。Nangate45 库不随仓分发，setup 脚本从 OpenROAD-flow-scripts 按 commit + SHA-256 拉取。\n\n## ⚠️ 方法论边界（引用时注意）\n\n面积与时序是**综合阶段**的预估（yosys/abc 映射 + 静态时序），**未经后端布局布线验证**，且使用**冻结的固定综合参数**（刻意不做设计专属调优）——因此公布数字是**保守、可复现的基线，不是最佳 QoR，也不是 sign-off 数值**。引用时不要当流片指标。\n\n## 为什么值得放进 IC 学习库\n\n- **AI 设计芯片的实证样本**：RTL 由 Kimi-K3 生成，是\"AI 参与芯片设计\"这条线难得的完整可复现仓库（含黄金模型 + testbench + 综合脚本）\n- **推理芯片全流程骨架**：从定点 self-model → RTL → Verilator 仿真 → yosys 综合 → 标准单元库时序/面积，一条链打通，可作为自己设计加速器的流程模板\n- **量化与精度判据的工程写法**：int4 group-128、cosine/argmax 双阈值，比只谈\"支持 int4\"具体得多\n- 与库内 NEORV32 / 玄铁（通用 RISC-V SoC）互补：那些是通用处理器，这个是**领域专用推理加速器**\n\n## 配套阅读\n\n- 中文 README：https://github.com/MoonshotAI/nano-kpu/blob/main/README_CN.md\n- 规格文档：`docs/`（架构 / 接口 / memory_map / 量化 / TASK_SPEC）\n\n_Last updated: 2026-09-16_","path":"0-Resources/4-OpenSource-Projects/nano-kpu.md"}]},{"name":"GPU 编程","items":[{"title":"CUDA Programming Guide","short":"CUDA Programming Guide","desc":"NVIDIA 官方 GPU 并行编程模型文档","date":"2026-04-03","tags":["cuda","gpu"],"content":"\n## 核心要点（摘要）\n\nNVIDIA 官方 CUDA 编程模型权威文档。涵盖 GPU 并行计算架构、执行模型、内存模型、线程层次结构等核心概念。\n\n## 主要内容\n\n- **CUDA C++ 编程接口** — GPU kernel 编写范式\n- **线程层次** — thread/block/grid 的组织结构\n- **内存层次** — global/shared/local/constant/texture memory\n- **执行模型** — stream、并发 kernel、同步机制\n- **硬件映射** — SM、 warp execution、occupancy\n\n## 个人备注\n\nGPU 编程的基石资料，理解 CUDA 架构对后续学习 GPU-based AI 加速、异构计算至关重要。\n\n_Last updated: 2026-04-03_\n","path":"0-Resources/5-Courses-Tutorials/cuda-programming-guide.md"},{"title":"Modern GPU Programming For MLSys","short":"Modern GPU Programming","desc":"MLC.ai/CMU 出品：Blackwell GPU Kernel 实战（TMA/Warp Spec/FlashAttention 4）","date":"2026-06-25","tags":["gpu","kernel","computer-architecture"],"content":"\n> MLC.ai 出品，基于 Blackwell 架构的现代 GPU Kernel 编程实战教材，聚焦硬件底层与极致性能优化。\n\n## 基本信息\n\n| 项目 | 详情 |\n|------|------|\n| **作者** | MLC.ai (Tianqi Chen 团队) |\n| **来源** | CMU Machine Learning Systems 课程系列 |\n| **编程模型** | TIRx Python DSL（贴近硬件的底层编程接口） |\n| **目标架构** | NVIDIA Blackwell (B200/B100) |\n| **核心案例** | GEMM 优化 + FlashAttention 4 |\n\n## 核心要点（摘要）\n\n从硬件架构视角理解现代 GPU：Blackwell 引入 TMA（Tensor Memory Accelerator）、更丰富的内存层级、新的协作模式（2-CTA Cluster）。本书提供从硬件模型到 Kernel 实现的全链路方法论，适合理解 GPU 微架构与编程模型的对应关系。\n\n## 目录结构\n\n### Part I: Understanding the GPU\nGPU 整体组织、编写快速 Kernel 的通用方法、数据布局、异步内存操作与协调机制。\n\n### Part II: TIRx Overview\nTIRx 语言关键元素，后续所有代码示例的基础。\n\n### Part III: GEMM — Tiled to SOTA\n分块 GEMM → TMA Pipelining → Persistent Scheduling → Warp Specialization → 2-CTA Clusters。\n\n### Part IV: Flash Attention 4\n完整 Attention Kernel：双 MMA + Softmax、Online-Softmax Rescaling、Causal Masking、GQA。\n\n### Reference\nTIRx 语言参考与编译器内部实现。\n\n## 硬件特性覆盖\n\n| Blackwell 特性 | 用途 | 所在章节 |\n|---------------|------|----------|\n| **TMA (Tensor Memory Accelerator)** | 异步数据搬运，减少指令开销 | Part III |\n| **SMEM 层级** | 共享内存与分布式共享内存 | Part I |\n| **Warp Specialization** | 生产者-消费者流水线 | Part III |\n| **2-CTA Cluster** | 跨 CTA 协作共享 SMEM | Part III |\n| **异步执行模型** | 计算与数据搬运重叠 | Part I/III |\n\n## 与 IC 设计学习的关联\n\n本书从「使用方视角」深入 GPU 微架构特性（TMA、Cluster、SMEM 层级），对理解 GPU 硬件设计动机和加速器架构（如 AI 专用加速器中的类似设计模式）有直接参考价值。配合 ysyx 项目中的 RISC-V 处理器设计，可建立「软件优化 ↔ 硬件特性」的双向理解。\n\n_Last updated: 2026-06-25_\n","path":"0-Resources/5-Courses-Tutorials/mlc-modern-gpu-programming.md"}]}]},{"name":"验证","skills":[{"name":"波形调试","items":[{"title":"wave-mcp","short":"wave-mcp","desc":"腾讯开源波形调试 MCP：只读波形 + RTL，给 AI Agent 37 个工具（值/X 态追踪、pass/fail diff、浏览器波形），免 License","date":"2026-10-31","tags":["verification","ai-agent","tencent","open-source"],"content":"\n> 腾讯蓬莱实验室验证团队开源的 **波形调试 MCP Server**：**不跑仿真器，只消费你已经产出的波形 + RTL 源码**，给 LLM/Code Agent 提供 **37 个工具（12 类）**的波形调试能力。纯开源栈（pylibfst + pyslang），免 License、不限并发、不限机器数——这正是 Agent 深度接入验证流程的前提。\n\n## 为什么值得关注\n\n商用调试 MCP 要 License 且并发受限，而 Agent 调试的特点是**高频、并发、海量点查询**（动辄成千上万条波形），License 成本撑不住。wave-mcp 的价值不在\"又一个波形工具\"，而在三点：\n\n1. **把波形调试变成 Agent 可调用的原语**——从\"看 log 猜原因\"升级为真读信号值、查驱动链、做 pass/fail diff\n2. **静态网表 + 动态波形在同一套工具里**——商用工具中这是两个产品，这里 `signal_drivers` 和 `signal_values` 同属一个 session\n3. **免 License 解除规模化瓶颈**\n\n## 核心能力\n\n| 能力 | 说明 |\n|------|------|\n| **波形查询（FST 直读）** | 层次、实例、信号位宽/方向/类型、点查询/区间查询、按时钟边沿对齐的逐拍采样；FST 随机访问契合 AI 的点查询模式 |\n| **静态分析（pyslang 网表）** | 连接、驱动、扇入/扇出、声明位置（文件:行号）；完整精化（参数/generate/interface 全展开），持久化为静态设计数据库 |\n| **无波形也能用** | `open_static_session` 只凭 RTL 建 session——仿真前就能查接口、查驱动、浏览层次、做 code review；波形出来后同一份 RTL 用 `prepare_session` 自动升级，网表复用 |\n| **值追踪与 X 态追踪** | `trace_value` 沿驱动链反向遍历、跨模块下钻，每个节点带真实 FST 值；`trace_x` 直接追 X 根因；`active_drivers` 用波形值对驱动语句门控条件做 **4 值求值**，回答\"这一拍到底哪条语句在起作用\" |\n| **pass/fail 波形对比** | `diff_waveforms` 对多份波形定位**首个分歧时刻**，按分歧时间排序信号、时钟对齐采样过滤毛刺；分歧信号可接 `signal_fanin`/`active_drivers` 做因果回溯 |\n| **Agent 驱动的浏览器波形查看器** | `open_wave_view` 让 Agent 分析完直接弹浏览器波形：嫌疑信号 + 游标钉在出错时刻 + 分析说明弹窗，双波形对比两栏同步；几十 GB FST 秒开（服务端流式，浏览器按需取数） |\n\n**典型闭环**：case 挂了 → `diff_waveforms([pass, fail])` 定位首分歧 → `signal_fanin`/`active_drivers` 回溯根因 → `open_wave_view` 双波形 + 分歧 marker + 说明一次呈现。\n\n37 个工具**全部同时提供 CLI 接口**，不挂 Agent 也能在终端直接调，适合写 CI 脚本。\n\n## 波形格式与仿真器支持\n\n| 格式 | 支持情况 |\n|------|----------|\n| **FST** | ✅ 直读。Verilator `--trace-fst`、Icarus `-fst` 直接产出 |\n| **VCD** | ✅ 自动转 FST（依赖 GTKWave 的 `vcd2fst`），体积约为 VCD 的 1/50；支持流式转换，把转换时间藏进仿真时间 |\n| **FSDB** | ✅ 自带 `fsdb2fst` 转换，只需本机有 Verdi 的 FsdbReader 运行库，**运行时不占 Verdi License** |\n| **SHM** | ❌ 不支持，也不在计划内。Xcelium 用户推荐用 `fstdumper` VPI 插件从仿真源头直接产 FST（免 License、零转换） |\n\n因此 VCS、Xcelium、Questa、Verilator、Icarus 都能接，区别只在走哪条转换通道。\n\n## 可信度（README 验证数据）\n\n- 真实生产级芯片项目（几十个模块）+ **OpenTitan 27 个 IP** + **香山 38 个 IP**，一百多个测试 case\n- **225 万信号级验证，值查询正确性 100%**；**310 万多次工具调用全部通过**；百万级 scope 的超大模块稳定完成分析\n- 工程细节（区分 demo 与生产工具的关键）：网表缺 `+incdir+` 时从 pyslang 诊断自愈重编；单 top 精化失败（如 UVM 环境拉不到 `uvm_pkg`）只影响该 top；网表以 `partial` 标志照常服务且 `session_info` 如实上报覆盖率；源码或波形变了但网表未更新会**报警，绝不静默给错结果**\n\n## 上手\n\n```bash\npip install wave-mcp                                    # Linux x86_64，Python 3.10–3.13\nwave-session --fst sim/dump.fst --top top_tb --filelist rtl.f   # 波形+filelist → session\npython -m wave_mcp.server --session sessions/my_module   # 启动 MCP Server\n```\n\n接入 Code Agent（Claude Code / Cursor / Gemini CLI / Cline / Windsurf 通用）在 MCP 配置里加：\n\n```json\n{ \"mcpServers\": { \"wave-mcp\": {\n    \"command\": \"python\",\n    \"args\": [\"-m\", \"wave_mcp.server\", \"--session\", \"/abs/path/to/sessions/my_module\"] } } }\n```\n\n⚠️ **两个坑**：\n1. 环境变量（`VERDI_HOME`、filelist 里的 `$PROJ_ROOT`）要写进 MCP 配置的 `env` 块，**不能用 shell export**——Agent 以子进程拉起 Server，继承不到交互式 shell 变量\n2. 隔离网 / CentOS 7 / 无 Python 3.10 的老机器：用 `deploy/docker_build_all.sh` 打离线 bundle，自带独立 Python 3.11 与全部依赖\n\n## 限制与边界\n\n- **平台**：Linux x86_64 官方支持；macOS / Windows 需自行编译 pylibfst，且波形查看器不可用\n- **查看器资产**（Surfer WASM + surver，EUPL-1.2）不随包分发，需按文档自行构建一次\n- 不内置任何协议库（事务定义由调用方给）；FSM 工具只报实际发生的转移，不做覆盖率\n- 不做多租户，一台机器服务多人需每人起一个进程\n- 目前更适合 **IP / 模块级调试**，SoC 级全芯片波形的实际表现待更多外部项目验证\n- 许可：文章与项目声明 **Apache-2.0**；GitHub SPDX 接口返回 `NOASSERTION`（未自动识别），正式引用以 LICENSE 原文为准\n\n## 与库内资源的关系\n\n- 与 `4-OpenSource-Projects/nano-kpu` 天然配对：那边是**设计**（RTL + Verilator 仿真流程），这边是**验证**（把仿真产出的 FST 交给 Agent 追根因）——Verilator `--trace-fst` 正好直接产出 wave-mcp 直读的格式\n- 对学 RTL 的人：`open_static_session` 只凭 RTL 就能做 code review 和驱动关系梳理，**不用先跑仿真**，是很低门槛的上手入口\n\n_Last updated: 2026-10-31_","path":"0-Resources/3-EDA-Tools/wave-mcp.md"}]},{"name":"形式验证 / UVM","items":[]}]},{"name":"物理设计","skills":[{"name":"版图与裸片分析","items":[{"title":"HiEq · Layout 裸片图库","short":"HiEq · Layout 裸片图库","desc":"222 张处理器 die shot（25 家厂商、标注工艺节点），在线浏览与原图下载","date":"2026-09-27","tags":["dieshot","layout","intel","amd","apple-silicon","gpu","qualcomm","hisilicon","semiconductor","reference"],"content":"\n> 个人维护的**处理器芯片裸片显微图（die shot）在线图库**：222 张高清裸片图，覆盖 **25 家厂商**，每张标注**工艺节点**（desc 字段，如 TSMC N3P / GlobalFoundries 14nm / IBM 32nm SOI），支持在线浏览与原图直下。图床与清单完全开源（[HiEq/Dieshot](https://github.com/HiEq/Dieshot)，manifest 为 `gallery.json`），站点部署在 Cloudflare Pages。\n\n## 厂商覆盖（张数）\n\n| 厂商 | 数量 | 厂商 | 数量 |\n|------|------|------|------|\n| Intel | 44 | Samsung | 12 |\n| AMD | 33 | MediaTek | 7 |\n| Apple Silicon | 31 | Microsoft | 5 |\n| NVIDIA | 24 | Google / Sony | 各 4 |\n| Qualcomm | 21 | Xiaomi | 3 |\n| **海思 Hisilicon** | 15 | IBM / Baikal / MCST-Elbrus | 各 2 |\n| 另有 | Cavium、Ampere、Centaur、Fungible、Glenfly（格罗方同）、**海光 Hygon**、**龙芯 Loongson**、**摩尔线程 MooreThreads**、Nikon、Spacemit（先楫）等 | | |\n\n## 内容质量\n\n- **分辨率极高**：原图宽度 2333 ~ **20958 px**（多数为摄影级拼接显微图），另有缩略图（`*.thumb.jpg`）供快速浏览\n- **工艺节点标注齐全**：Apple M5（TSMC N3P）、AMD Zen4 CCD（N5）、Storm Peak IOD（6nm）、Raven Ridge（GF 14nm）、IBM Power 7+（32nm SOI）、MediaTek Helio G95（12nm）等\n- 覆盖 CPU / GPU / SoC / 基带 / 游戏主机芯片，含**国产芯片**（海思、海光、龙芯、摩尔线程、先楫）\n\n## 用法\n\n- **在线浏览**：https://hieq-home404.pages.dev/#/layout （搜索、标签筛选、灯箱逐张看图、←/→ 翻页）\n- **原图直下**：图片 URL 规律 `images/dieshot/{vendor}/{file}`，右键另存即可；`gallery.json` 是机器可读清单（id/title/desc/tags/src/thumb/w/h），可程序化批量拉取\n- 杂图区：https://hieq-home404.pages.dev/#/misc\n\n## 为什么值得收藏\n\n- **微架构学习的直观素材**：对照 ISA/论文读 die shot，能直观看到 core/缓存/IO 的面积占比与多核拓扑\n- **工艺节点演进的视觉证据**：同一厂商跨节点（如 Intel 44 张横跨多代）对比，晶体管密度变化一目了然\n- 与库内 nano-kpu（推理芯片 RTL）互补：那个给你**怎么设计**，这个给你**造出来长什么样**\n\n⚠️ 版权注意：die shot 原片多来自社区摄影（Flickr 等），个人学习/研究使用，转载发表前自行确认授权。\n\n_Last updated: 2026-09-27_","path":"0-Resources/4-OpenSource-Projects/hieq-dieshot-gallery.md"}]},{"name":"综合 / STA / PnR","items":[]}]},{"name":"制造工艺","skills":[{"name":"制造全流程","items":[{"title":"半導體製造概論","short":"半導體製造概論","desc":"913★ 开放教材：沙子→晶圆→制程→封测全流程，24 章 + 术语框/实务框，零基础可读，四语言","date":"2026-10-16","tags":["semiconductor","cmos","lithography","etch","thin-film","cmp","packaging","test","book","chinese","beginner"],"content":"\n> 面向初学者的开放教材（**913★**），追踪一片硅晶圆从**沙子 → 晶圆厂 → 制程模块与整合 → 测试 → 封装 → 芯片**的全过程。刻意跳过重物理，专注** // 现代简约低饱和度色板
const COLORS = ["#64748b", "#2563eb", "#059669", "#d97706", "#7c3aed", "#db2777", "#0891b2", "#4f46e5"];
const REPO = "https://github.com/70asunflower/ai-learning-journey/blob/master/";
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = (s, n = 36) => s.length > n ? s.slice(0, n) + "…" : s;

// 根据标签提取资源类型，帮助判断学习方式
function getResourceKind(tags) {
  if (tags.includes("from-scratch")) return "手搓实战";
  if (tags.includes("book")) return "书籍";
  if (tags.includes("course")) return "系统课程";
  if (tags.includes("docs")) return "官方文档";
  if (tags.includes("framework")) return "框架源码";
  if (tags.includes("visualization")) return "交互可视化";
  if (tags.includes("roadmap")) return "学习路线";
  if (tags.includes("blog")) return "博客专栏";
  if (tags.includes("video")) return "视频";
  if (tags.includes("tool") || tags.includes("benchmarking")) return "工具";
  return "教程";
}

const folded = new Set();
let focusTrunk = -1;
let query = "";
let selectedPath = "";

const trunks = [
  { ...TREE.foundation, isBase: true },
  ...TREE.branches.map(b => ({ ...b, isBase: false }))
].map((t, i) => ({ name: t.name, skills: t.skills, isBase: t.isBase, i }));

el("nTrunk").textContent = `1 个基础层 + ${TREE.branches.length} 个技术方向`;
el("nSkill").textContent = trunks.reduce((a, t) => a + t.skills.length, 0);
el("nLeaf").textContent = trunks.reduce((a, t) => a + t.skills.reduce((b, s) => b + s.items.length, 0), 0);

// 渲染顶部筛选按钮
el("legend").innerHTML = `<button class="lg on" data-i="-1" type="button"><i style="background:var(--ink)"></i>全部路径</button>` +
  trunks.map(t => `<button class="lg" data-i="${t.i}" type="button" style="--c:${COLORS[t.i]}"><i></i>${esc(t.name)}</button>`).join("");

function setFocusTrunk(idx, updateHash = true) {
  focusTrunk = idx;
  el("legend").querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", +b.dataset.i === idx);
  });
  if (updateHash) {
    if (idx === -1) {
      history.replaceState(null, "", location.pathname + location.search);
    } else {
      location.hash = "path=" + encodeURIComponent(trunks[idx].name);
    }
  }
  render();
}

el("legend").querySelectorAll("button").forEach(b => {
  b.onclick = () => setFocusTrunk(+b.dataset.i);
});

function curve(x1, y1, x2, y2) {
  const dx = Math.max(36, (x2 - x1) * 0.5);
  return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}

function render() {
  const ROW = 36, PAD = 24;
  const nodes = [], wires = [];
  let row = 0;
  const yOfLeaf = () => (row++ * ROW + ROW / 2 + PAD);
  const trunkYs = [];
  let dividerY = null;

  trunks.forEach((t, idx) => {
    const c = COLORS[t.i], tk = "t" + t.i, tFold = folded.has(tk);
    const skillYs = [];

    t.skills.forEach((s, si) => {
      const sk = tk + "s" + si, sFold = folded.has(sk) || tFold;
      const leafYs = [];
      if (!sFold) s.items.forEach(() => leafYs.push(yOfLeaf()));
      const sy = leafYs.length ? leafYs.reduce((a, b) => a + b, 0) / leafYs.length : yOfLeaf();
      skillYs.push(sy);

      nodes.push(`
        <div class="node n-skill ${s.items.length ? '' : 'empty'}" id="node-${sk}" data-t="${t.i}" data-s="${sk}" style="top:${sy - 14}px;--c:${c}" data-key="${sk}" title="${s.items.length ? '点击展开或收起资源' : '暂无资源'}">
          <span>${esc(s.name)}</span>
          <span class="fold">${s.items.length ? (sFold ? '+' : '−') : '0'}</span>
        </div>
      `);

      if (!sFold) {
        s.items.forEach((it, li) => {
          const y = leafYs[li];
          const text = (it.title + " " + it.desc + " " + it.tags.join(" ")).toLowerCase();
          const hit = query && text.includes(query);
          const faded = query && !hit;
          const kind = getResourceKind(it.tags);
          const isSelected = selectedPath === it.path;

          nodes.push(`
            <div class="node n-leaf ${hit ? 'hit' : ''} ${faded ? 'faded' : ''} ${isSelected ? 'selected' : ''}"
              data-t="${t.i}" data-s="${sk}" data-path="${esc(it.path)}"
              style="top:${y - 13}px;--c:${c}">
              <span class="pip">${String(li + 1).padStart(2, '0')}</span>
              <span class="txt">${esc(short(it.short || it.title))}</span>
              <span class="kind">${esc(kind)}</span>
            </div>
          `);
          wires.push(`<path d="${curve(624, sy, 672, y)}" stroke="${c}" stroke-width="1.2" stroke-opacity="0.35" fill="none" data-t="${t.i}" data-s="${sk}" data-leaf="${esc(it.path)}"/>`);
        });
      }
    });

    const ty = skillYs.reduce((a, b) => a + b, 0) / skillYs.length;
    trunkYs.push(ty);

    nodes.push(`
      <div class="node n-trunk" id="node-${tk}" data-t="${t.i}" style="top:${ty - 17}px;--c:${c}" data-key="${tk}" title="点击展开或收起该方向">
        <span>${esc(t.name)}</span>
        ${t.isBase ? '<span class="badge-base">前置</span>' : ''}
        <span class="cnt">${t.skills.reduce((a, s) => a + s.items.length, 0)}</span>
        <span class="fold">${tFold ? '+' : '−'}</span>
      </div>
    `);

    skillYs.forEach((sy, si) => {
      const sk = tk + "s" + si;
      wires.push(`<path d="${curve(394, ty, 440, sy)}" stroke="${c}" stroke-width="1.5" stroke-opacity="0.55" fill="none" data-t="${t.i}" data-s="${sk}"/>`);
    });

    // 在基础层之后记录分隔线位置
    if (idx === 0) {
      row += 0.4;
      dividerY = row * ROW + PAD - ROW * 0.2;
    }
  });

  const ry = trunkYs.reduce((a, b) => a + b, 0) / trunkYs.length;
  nodes.push(`
    <div class="node n-root" style="top:${ry - 26}px">
      <span>AI 技术栈</span>
      <small>7 大进阶方向</small>
    </div>
  `);
  trunkYs.forEach((ty, i) => {
    wires.push(`<path d="${curve(160, ry, 210, ty)}" stroke="${COLORS[i]}" stroke-width="2" stroke-opacity="0.7" fill="none" data-t="${i}"/>`);
  });

  const tree = el("tree"), H = row * ROW + PAD * 2, W = 1220;
  tree.style.height = H + "px";
  tree.style.width = W + "px";

  const svg = el("wires");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.innerHTML = wires.join("");

  let dividerHTML = "";
  if (dividerY !== null) {
    dividerHTML = `<div class="divider-line" style="top:${dividerY}px"></div><div class="divider-label" style="top:${dividerY}px">进阶技术方向</div>`;
  }
  el("nodes").innerHTML = dividerHTML + nodes.join("");

  // 折叠事件
  el("nodes").querySelectorAll("[data-key]").forEach(n => {
    n.onclick = () => {
      const k = n.dataset.key;
      folded.has(k) ? folded.delete(k) : folded.add(k);
      render();
    };
  });

  // 应用主干聚焦过滤
  applyFocusState();
  bindLeafEvents();
}

function applyFocusState() {
  el("nodes").querySelectorAll(".node").forEach(n => {
    if (n.classList.contains("n-root")) return;
    n.classList.toggle("dim", focusTrunk !== -1 && +n.dataset.t !== focusTrunk);
  });
  el("wires").querySelectorAll("path").forEach(p => {
    const match = focusTrunk === -1 || +p.dataset.t === focusTrunk;
    p.style.opacity = match ? "1" : "0.08";
  });
}

// 悬停高亮完整路径 + 点击打开右侧详情抽屉
function bindLeafEvents() {
  el("nodes").querySelectorAll(".n-leaf").forEach(leaf => {
    const tIdx = leaf.dataset.t;
    const sKey = leaf.dataset.s;
    const path = leaf.dataset.path;

    leaf.addEventListener("mouseenter", () => {
      el("node-t" + tIdx)?.classList.add("active-path");
      el("node-" + sKey)?.classList.add("active-path");
      el("wires").querySelectorAll("path").forEach(p => {
        const isBranchRootWire = p.dataset.t === tIdx && !p.dataset.s;
        const isSkillWire = p.dataset.s === sKey && !p.dataset.leaf;
        const isLeafWire = p.dataset.leaf === path;
        if (isBranchRootWire || isSkillWire || isLeafWire) {
          p.style.opacity = "1";
          p.setAttribute("stroke-width", "2.4");
        } else {
          p.style.opacity = "0.12";
        }
      });
    });

    leaf.addEventListener("mouseleave", () => {
      el("node-t" + tIdx)?.classList.remove("active-path");
      el("node-" + sKey)?.classList.remove("active-path");
      el("wires").querySelectorAll("path").forEach(p => {
        const isRootWire = !p.dataset.s;
        const isSkillWire = p.dataset.s && !p.dataset.leaf;
        p.setAttribute("stroke-width", isRootWire ? "2" : (isSkillWire ? "1.5" : "1.2"));
      });
      applyFocusState();
    });

    leaf.addEventListener("click", () => openDrawer(path));
  });
}

// 详情抽屉控制
function openDrawer(path) {
  let found = null;
  trunks.forEach(t => {
    t.skills.forEach(s => {
      s.items.forEach(it => {
        if (it.path === path) found = { item: it, trunk: t, skill: s };
      });
    });
  });
  if (!found) return;

  selectedPath = path;
  el("nodes").querySelectorAll(".n-leaf").forEach(n => {
    n.classList.toggle("selected", n.dataset.path === path);
  });

  const c = COLORS[found.trunk.i];
  el("dPath").innerHTML = `<i style="background:${c}"></i> ${esc(found.trunk.name)} / ${esc(found.skill.name)}`;
  el("dTitle").textContent = found.item.title;
  el("dDesc").textContent = found.item.desc;
  el("dTags").innerHTML = found.item.tags.map(tag => `<span>#${esc(tag)}</span>`).join("");
  el("dMeta").textContent = `收录日期: ${found.item.date} · 路径: ${found.item.path}`;
  el("dLink").href = REPO + found.item.path;
  el("dBody").innerHTML = (window.marked && found.item.content)
    ? marked.parse(found.item.content)
    : '<p style="color:var(--muted)">正文暂不可用，请点击下方链接查看原文。</p>';
  el("dBody").scrollTop = 0;

  el("drawerMask").classList.add("open");
  el("drawer").classList.add("open");
  el("drawer").setAttribute("aria-hidden", "false");
}

function closeDrawer() {
  selectedPath = "";
  el("nodes").querySelectorAll(".n-leaf.selected").forEach(n => n.classList.remove("selected"));
  el("drawerMask").classList.remove("open");
  el("drawer").classList.remove("open");
  el("drawer").setAttribute("aria-hidden", "true");
}

el("dClose").onclick = closeDrawer;
el("drawerMask").onclick = closeDrawer;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
});

// 展开/收起按钮
el("expand").onclick = () => { folded.clear(); render(); };
el("collapse").onclick = () => {
  folded.clear();
  trunks.forEach((t, i) => {
    folded.add("t" + i);
    t.skills.forEach((_, j) => folded.add("t" + i + "s" + j));
  });
  render();
};

// 搜索联动
el("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  if (query) {
    folded.clear();
    trunks.forEach((t, ti) => t.skills.forEach((s, si) => {
      const has = s.items.some(it => (it.title + " " + it.desc + " " + it.tags.join(" ")).toLowerCase().includes(query));
      if (has) folded.delete("t" + ti + "s" + si);
      else folded.add("t" + ti + "s" + si);
    }));
  }
  render();
});

// 日间/夜间模式切换
el("theme").onclick = () => {
  const d = document.documentElement;
  const isDark = d.getAttribute("data-theme") !== "dark";
  d.setAttribute("data-theme", isDark ? "dark" : "light");
  el("theme").dataset.tip = isDark ? "切换到日间模式" : "切换到夜间模式";
};

// 初始化解析 URL Hash（支持 #path=推理与部署）
function initFromHash() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (hash.startsWith("path=")) {
    const targetName = hash.slice(5);
    const matched = trunks.find(t => t.name === targetName);
    if (matched) {
      setFocusTrunk(matched.i, false);
      return;
    }
  }
  render();
}

initFromHash();
</script>
</body>
